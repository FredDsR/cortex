openapi: 3.0.0
info:
  title: Demo
  version: "1.0"
paths:
  /users:
    get:
      summary: List users
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        account:
          $ref: '#/components/schemas/Account'
    Account:
      type: object
      properties:
        name:
          type: string
