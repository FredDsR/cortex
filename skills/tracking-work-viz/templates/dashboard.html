<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>work-viz: dashboard</title>
  <link rel="stylesheet" href="vendor/dashboard.css">
</head>
<body>
  <header>
    <h1>~/.work/ workspaces</h1>
    <div class="subtitle">Snapshot of all tracked sessions and tasks. Click a workspace to open its viewer.</div>
  </header>
  <main>
    <div id="summary" class="summary-bar"></div>
    <section id="dash-graph-section">
      <div class="dash-graph-header">
        <span class="dash-graph-title">Cross-workspace graph</span>
        <div class="topbar-chips">
          <button id="chip-blocked" class="chip on" type="button" aria-pressed="true">Blocked by</button>
          <button id="chip-related" class="chip on" type="button" aria-pressed="true">Related to</button>
          <button id="chip-follows" class="chip on" type="button" aria-pressed="true">Follows</button>
          <button id="chip-mentions" class="chip" type="button" aria-pressed="false">Mentions</button>
        </div>
      </div>
      <div id="dash-cy-host"></div>
    </section>
    <div class="thead">
      <div>workspace</div>
      <div>task status</div>
      <div class="right">tasks</div>
      <div>last touched</div>
      <div class="right">agents</div>
    </div>
    <div id="rows"></div>
    <div id="idle-section" class="idle-section" style="display:none;">
      <button id="idle-toggle" class="idle-toggle" type="button">
        <span class="caret">&#9656;</span>
        <span id="idle-toggle-label">Idle workspaces</span>
      </button>
      <div id="idle-rows"></div>
    </div>
  </main>
  <script>
    window.VIZ_DASHBOARD_DATA = @@DATA@@;
    window.__CY_DATA__ = @@CY_DATA@@;
  </script>
  <script src="vendor/cytoscape.min.js"></script>
  <script src="vendor/dagre.min.js"></script>
  <script src="vendor/cytoscape-dagre.min.js"></script>
  <script src="vendor/dashboard.js"></script>
</body>
</html>
