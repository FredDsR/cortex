name: publish

# Triggered by the GitHub Release that release-please publishes when its
# release PR is merged.
on:
  release:
    types: [published]

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing exchanges this OIDC token for a short-lived PyPI
      # credential, so no API token is stored anywhere. Mandatory.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
