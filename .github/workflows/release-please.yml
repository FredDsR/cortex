name: release-please

# Version bumps are derived from the conventional commits this repo already
# enforces via .conventional-types and the PR title gate. Squash-merge makes
# each PR title the commit message on main, which is what release-please reads.
on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publishing lives in this workflow, not behind `on: release`, because
  # release-please creates the release with GITHUB_TOKEN and "events triggered
  # by the GITHUB_TOKEN will not create a new workflow run". A separate
  # release-triggered workflow would never fire, and the release would tag
  # without ever publishing. Jobs within one workflow have no such limit.
  pypi:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing exchanges this OIDC token for a short-lived PyPI
      # credential, so no API token is stored anywhere. Mandatory.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
