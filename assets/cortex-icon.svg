<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="cortex">
  <defs>
    <linearGradient id="cx" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#2FA6C9"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#cx)" stroke-linecap="round" stroke-linejoin="round">
    <!-- command prompt caret -->
    <path d="M16 24 L34 48 L16 72" stroke-width="9"/>
    <!-- caret -> hub -->
    <path d="M34 48 L46 48" stroke-width="3"/>
    <!-- hub -> ring1 -->
    <path d="M46 48 L57.5 31.6" stroke-width="2.4"/>
    <path d="M46 48 L65 41.8" stroke-width="2.4"/>
    <path d="M46 48 L65 54.2" stroke-width="2.4"/>
    <path d="M46 48 L57.5 64.4" stroke-width="2.4"/>
    <!-- ring1 -> ring2 -->
    <path d="M57.5 31.6 L61 19.7" stroke-width="2"/>
    <path d="M57.5 31.6 L73.1 31" stroke-width="2"/>
    <path d="M65 41.8 L73.1 31" stroke-width="2"/>
    <path d="M65 41.8 L78 48" stroke-width="2"/>
    <path d="M65 54.2 L78 48" stroke-width="2"/>
    <path d="M65 54.2 L73.1 65" stroke-width="2"/>
    <path d="M57.5 64.4 L73.1 65" stroke-width="2"/>
    <path d="M57.5 64.4 L61 76.3" stroke-width="2"/>
  </g>
  <g fill="url(#cx)">
    <!-- hub -->
    <circle cx="46" cy="48" r="5.5"/>
    <!-- ring1 -->
    <circle cx="57.5" cy="31.6" r="4"/>
    <circle cx="65" cy="41.8" r="4"/>
    <circle cx="65" cy="54.2" r="4"/>
    <circle cx="57.5" cy="64.4" r="4"/>
    <!-- ring2 -->
    <circle cx="61" cy="19.7" r="3.4"/>
    <circle cx="73.1" cy="31" r="3.4"/>
    <circle cx="78" cy="48" r="3.4"/>
    <circle cx="73.1" cy="65" r="3.4"/>
    <circle cx="61" cy="76.3" r="3.4"/>
  </g>
</svg>
